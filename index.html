<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>수 배열 규칙 찾기 대결! (1학년 1반)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Jua & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet" />
  <style>
- {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      background-color: #FFFDF7;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }

    /* 애니메이션 정의 */
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    @keyframes floatScore {
      0% { transform: translateY(8px) scale(0.7); opacity: 0; }
      25% { transform: translateY(-10px) scale(1.15); opacity: 1; }
      80% { transform: translateY(-28px) scale(1); opacity: 1; }
      100% { transform: translateY(-42px) scale(0.95); opacity: 0; }
    }

    @keyframes pulseCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @keyframes urgentTimer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-shake {
      animation: shakeWrong 0.36s ease-in-out;
    }

    .animate-float-score {
      animation: floatScore 0.85s ease-out forwards;
    }

    .cursor-blink {
      animation: pulseCursor 0.9s infinite;
    }

    .timer-urgent {
      animation: urgentTimer 0.7s infinite;
    }

    /* 키패드 터치 반응 */
    .keypad-btn {
      transition: transform 0.05s ease, filter 0.08s ease;
    }
    .keypad-btn:active, .keypad-btn.pressed {
      transform: scale(0.92) translateY(2px);
      filter: brightness(0.94);
    }

    /* 테마별 타일 디자인 */
    /* 1. 기차 칸 테마 */
    .theme-train {
      border-radius: 18px 18px 10px 10px;
      position: relative;
    }
    .theme-train::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 16%;
      right: 16%;
      height: 8px;
      background: radial-gradient(circle, #334155 4px, transparent 5px) left center / 18px 8px no-repeat,
                  radial-gradient(circle, #334155 4px, transparent 5px) right center / 18px 8px no-repeat;
    }

    /* 2. 풍선 띠 테마 */
    .theme-balloon {
      border-radius: 9999px;
      position: relative;
    }

    /* 3. 징검다리 테마 */
    .theme-stone {
      border-radius: 36% 64% 58% 42% / 44% 40% 60% 56%;
    }

    /* 4. 나무 블록 테마 */
    .theme-block {
      border-radius: 14px;
      box-shadow: 0 5px 0 rgba(120, 53, 15, 0.28);
    }

    .num-tile {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen bg-[#FFFDF7] text-slate-800">

  <!-- ==================== 상단 통합 점수 & 타이머 헤더 ==================== -->
  <header class="relative z-20 flex items-center justify-between px-3 sm:px-6 py-2 bg-white border-b-4 border-amber-200 shadow-sm shrink-0">
    <!-- 왼쪽: 파랑팀 점수 배지 -->
    <div class="relative flex items-center gap-2 sm:gap-3 bg-blue-600 text-white px-3.5 sm:px-5 py-1.5 rounded-2xl border-b-4 border-blue-800 shadow">
      <span class="text-xl sm:text-2xl">💙</span>
      <span class="text-lg sm:text-2xl">파랑팀</span>
      <div class="bg-white text-blue-700 px-3 py-0.5 rounded-xl text-2xl sm:text-4xl tracking-tight">
        <span id="score-left">0</span><span class="text-base sm:text-xl ml-0.5">점</span>
      </div>
      <div id="popup-left" class="pointer-events-none absolute -bottom-8 right-2 z-30"></div>
    </div>

    <!-- 중앙: 타이머 + 교사용 제어 버튼 -->
    <div class="flex items-center gap-2 sm:gap-3">
      <div id="timer-box" class="flex items-center gap-2 bg-slate-900 text-white px-4 sm:px-6 py-1.5 rounded-2xl border-4 border-amber-400 shadow-md">
        <span class="hidden sm:inline text-amber-300 text-base sm:text-lg">⏱ 남은 시간</span>
        <span id="timer-display" class="text-2xl sm:text-4xl tracking-wider text-white">03:00</span>
      </div>

      <button id="pause-btn" type="button" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 border-2 border-slate-300 text-sm sm:text-base transition cursor-pointer">
        ⏸ 일시정지
      </button>
      <button id="reset-btn" type="button" class="px-3 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 active:scale-95 text-amber-900 border-2 border-amber-300 text-sm sm:text-base transition cursor-pointer">
        🔄 처음부터
      </button>
    </div>

    <!-- 오른쪽: 빨강팀 점수 배지 -->
    <div class="relative flex items-center gap-2 sm:gap-3 bg-rose-600 text-white px-3.5 sm:px-5 py-1.5 rounded-2xl border-b-4 border-rose
